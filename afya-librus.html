<style>
  /* AFYA – common editor style (identical in all AFYA nodes) */
  .afya-form .form-row > label { width: 130px; }
  .afya-form .afya-section {
    display: flex; align-items: center; gap: 7px;
    margin: 18px 0 10px; padding-bottom: 5px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #ddd);
    color: var(--red-ui-primary-text-color, #555);
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  }
  .afya-form .afya-section > i { color: #3E9C86; width: 14px; text-align: center; }
  .afya-form .afya-hint { margin: -4px 0 12px 134px; font-size: 12px; line-height: 1.45; color: var(--red-ui-secondary-text-color, #888); }
  .afya-form .afya-hint code { font-size: 11px; }
  .afya-form .afya-check { display: flex; align-items: center; gap: 8px; margin: 0 0 12px 134px; }
  .afya-form .afya-check input { width: auto; margin: 0; }
  .afya-form .afya-check label { width: auto; margin: 0; cursor: pointer; }
  .afya-form .afya-unit { margin-left: 8px; color: var(--red-ui-secondary-text-color, #888); }
  .afya-form .afya-summary {
    display: flex; gap: 10px; align-items: flex-start;
    margin-top: 18px; padding: 10px 12px; border-radius: 6px;
    border-left: 4px solid #6CC1AD;
    background: var(--red-ui-tertiary-background, #f7f7f7);
    color: var(--red-ui-primary-text-color, #555); font-size: 12px; line-height: 1.55;
  }
  .afya-form .afya-summary > i { margin-top: 3px; color: #3E9C86; }
  .afya-form .afya-summary code { font-size: 11px; }
</style>

<script type="text/javascript">
  (function () {
    const plainKey = (v) => String(v || '').replace(/^#:\(\S+?\)::/, '');
    const DEFAULT_GRADE = '%uczen%: %zapis% z %przedmiot% (%kategoria%) %komentarz%';
    const DEFAULT_NOTE = '%uczen%: uwaga %rodzaj% – %tresc% (%nauczyciel%)';
    const esc = (v) => $('<span>').text(v).html();
    const TEXTS = {
      en: {
        name: 'Name', namePh: 'e.g. Librus – John', lang: 'Labels', langAuto: 'system language ({l})',
        secAccount: 'Librus Synergia account', login: 'Login', loginPh: 'parent or student login', password: 'Password',
        credHint: 'Stored as Node-RED credentials – never exported with the flow.',
        secGrade: 'New grade', sendGrade: 'Send info about a new grade', text: 'Text',
        appendAll: 'Append all grades of the subject, e.g. <code>| oceny: 5(1), 6(3), 4[1](2)</code>', output: 'output',
        secNote: 'New note', sendNote: 'Send info about a new note (<i>uwaga</i>)',
        bezPl: 'Without Polish letters (160 instead of 70 characters per SMS)',
        bothHint: 'Both texts together, one line each: <code>payload.tekst</code> – empty when nothing is new.',
        secPage: 'Grades page', showPage: 'Show a web page with the grades (class, subjects A–Z, averages)',
        pageTitle: 'Page title', pageTitlePh: "e.g. John's grades (empty = student's name)", pagePath: 'Page path',
        pathHint: 'One path per child, e.g. <code>afya/john</code> and <code>afya/anna</code>. Address:',
        afterDeploy: '(works after deploy)', pagePassword: 'Page password',
        pwHint: 'Login form, then the browser stays logged in for 30 days. Stored as Node-RED credentials.',
        token: 'Access token', tokenPh: 'optional – link without logging in', generate: 'Generate', copy: 'Copy',
        linkCopied: 'Link copied',
        tokenHint: 'For a smart mirror or a wall tablet: the link below opens the page without logging in. ' +
          'Anyone with the link sees the grades – generate a new token to revoke it. Set a password, a token, or both.',
        secVar: 'Context variable', variable: 'Variable', variablePh: 'optional, e.g. librus_john',
        varHint: 'Optional. Keeps the last <code>msg.payload</code> – choose <b>global</b> to read it from any flow.',
        sGrade: '<b>New grade</b> → <code>payload.tekstOceny</code>:',
        sNoGrade: 'New grades: <b>no info</b> (still listed in <code>payload.nowe</code>).',
        sNote: '<b>New note</b> → <code>payload.tekstUwagi</code>:',
        sNoNote: 'New notes: <b>no info</b> (notes are not read).',
        sBoth: 'Both together: <code>payload.tekst</code>.', sBezPl: 'Polish letters are replaced (ą → a …).',
        sPage: 'Grades page:', sPwToken: 'password, or the link with the token', sPw: 'password',
        sToken: 'only the link with the token', sOff: '<b>off until a password or token is set</b>',
        sVar: 'Last result is also stored in {v}.', sNoVar: 'Last result is not stored in a context variable.',
      },
      pl: {
        name: 'Nazwa', namePh: 'np. Librus – Jaś', lang: 'Etykiety', langAuto: 'język systemu ({l})',
        secAccount: 'Konto Librus Synergia', login: 'Login', loginPh: 'login rodzica lub ucznia', password: 'Hasło',
        credHint: 'Zapisywane jako dane uwierzytelniające Node-RED – nie trafiają do eksportu flow.',
        secGrade: 'Nowa ocena', sendGrade: 'Wysyłaj info o nowej ocenie', text: 'Tekst',
        appendAll: 'Dopisz wszystkie oceny z przedmiotu, np. <code>| oceny: 5(1), 6(3), 4[1](2)</code>', output: 'wyjście',
        secNote: 'Nowa uwaga', sendNote: 'Wysyłaj info o nowej uwadze',
        bezPl: 'Bez polskich znaków (160 zamiast 70 znaków w jednym SMS-ie)',
        bothHint: 'Oba teksty razem, każdy w osobnej linii: <code>payload.tekst</code> – pusty, gdy nic nowego.',
        secPage: 'Strona z ocenami', showPage: 'Pokazuj stronę z ocenami (klasa, przedmioty A–Z, średnie)',
        pageTitle: 'Tytuł strony', pageTitlePh: 'np. Oceny Jasia (puste = imię i nazwisko ucznia)', pagePath: 'Ścieżka strony',
        pathHint: 'Każde dziecko – osobna ścieżka, np. <code>afya/jas</code> i <code>afya/ola</code>. Adres:',
        afterDeploy: '(działa po wdrożeniu)', pagePassword: 'Hasło strony',
        pwHint: 'Formularz logowania, potem przeglądarka pamięta logowanie przez 30 dni. Zapisywane jako dane uwierzytelniające Node-RED.',
        token: 'Token dostępu', tokenPh: 'opcjonalnie – link bez logowania', generate: 'Generuj', copy: 'Kopiuj',
        linkCopied: 'Skopiowano link',
        tokenHint: 'Na lustro lub tablet na ścianie: link poniżej otwiera stronę bez logowania. ' +
          'Każdy, kto ma link, widzi oceny – wygeneruj nowy token, żeby go unieważnić. Ustaw hasło, token albo oba.',
        secVar: 'Zmienna kontekstu', variable: 'Zmienna', variablePh: 'opcjonalnie, np. librus_jas',
        varHint: 'Opcjonalnie. Przechowuje ostatni <code>msg.payload</code> – wybierz <b>global</b>, żeby czytać go z każdego flow.',
        sGrade: '<b>Nowa ocena</b> → <code>payload.tekstOceny</code>:',
        sNoGrade: 'Nowe oceny: <b>bez informacji</b> (nadal są w <code>payload.nowe</code>).',
        sNote: '<b>Nowa uwaga</b> → <code>payload.tekstUwagi</code>:',
        sNoNote: 'Nowe uwagi: <b>bez informacji</b> (uwagi nie są czytane).',
        sBoth: 'Oba razem: <code>payload.tekst</code>.', sBezPl: 'Polskie znaki są zamieniane (ą → a …).',
        sPage: 'Strona z ocenami:', sPwToken: 'hasło albo link z tokenem', sPw: 'hasło',
        sToken: 'tylko link z tokenem', sOff: '<b>wyłączona, dopóki nie ustawisz hasła lub tokenu</b>',
        sVar: 'Ostatni wynik trafia też do {v}.', sNoVar: 'Ostatni wynik nie jest zapisywany w zmiennej kontekstu.',
      },
    };
    // --- AFYA: język opisów w oknie konfiguracji („Labels”): auto = polski tylko dla polskiego systemu,
    //     angielski dla wszystkich innych; zmieniają się tylko opisy – nigdy pola ani wartości.
    const afyaSystemLocale = function () {
      try {
        return localStorage.getItem('editor-language') || navigator.language || '';
      } catch (e) {
        return navigator.language || '';
      }
    };
    const afyaLang = function (setting) {
      if (setting === 'pl' || setting === 'en') return setting;
      return /^pl\b|^pl[-_]/i.test(afyaSystemLocale()) ? 'pl' : 'en';
    };
    /** Tłumaczy otwarte okno (data-t, data-t-ph, data-t-title) i zwraca T(klucz, zmienne) dla tekstów z kodu. */
    const afyaApplyLang = function (form, texts, setting) {
      const lang = afyaLang(setting);
      const T = function (k, v) {
        let s = (texts[lang] && texts[lang][k]) || texts.en[k] || k;
        Object.keys(v || {}).forEach(function (n) {
          s = s.split('{' + n + '}').join(v[n]);
        });
        return s;
      };
      form.find('[data-t]').each(function () {
        $(this).html(T($(this).attr('data-t')));
      });
      form.find('[data-t-ph]').each(function () {
        $(this).attr('placeholder', T($(this).attr('data-t-ph')));
      });
      form.find('[data-t-title]').each(function () {
        $(this).attr('title', T($(this).attr('data-t-title')));
      });
      form.find('#node-input-lang option[value="auto"]').text(T('langAuto', { l: afyaLang('auto') === 'pl' ? 'Polski' : 'English' }));
      return T;
    };

    RED.nodes.registerType('afya-librus', {
      category: 'AFYA',
      color: '#A6DCCF',
      paletteLabel: 'librus grades',
      icon: 'font-awesome/fa-graduation-cap',
      inputs: 1,
      outputs: 1,
      inputLabels: 'check now (e.g. inject every 1 h); msg.test = true',
      outputLabels: 'msg.payload = { ok, nowe, tekst, tekstOceny, tekstUwagi, oceny, … }',
      defaults: {
        name: { value: '' },
        lang: { value: 'auto' },
        szablon: { value: '' },
        oceny: { value: true },
        bezPl: { value: false },
        zTablica: { value: false },
        uwagi: { value: false },
        szablonUwagi: { value: '' },
        variableName: { value: '', required: false },
        scope: { value: 'global' },
        strona: { value: false },
        tytulStrony: { value: '' },
        sciezka: {
          value: 'afya/oceny',
          validate: function (v) {
            return /^\/*[a-z0-9][a-z0-9_-]*(\/[a-z0-9][a-z0-9_-]*)*\/*$/i.test(String(v || '').trim());
          },
        },
      },
      credentials: {
        login: { type: 'text' },
        haslo: { type: 'password' },
        hasloStrony: { type: 'password' },
        tokenStrony: { type: 'text' },
      },
      label: function () {
        return this.name || 'Librus – grades';
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
      oneditprepare: function () {
        if (!this.scope) $('#node-input-scope').val('global');
        if (['auto', 'en', 'pl'].indexOf(this.lang) < 0) $('#node-input-lang').val('auto'); // starsze węzły
        const form = $('#node-input-lang').closest('.afya-form');
        let T = afyaApplyLang(form, TEXTS, $('#node-input-lang').val());
        const variable = $('#node-input-variableName');
        variable.typedInput({ types: ['global', 'flow'], typeField: '#node-input-scope' });

        // starsze węzły nie mają pola „oceny” – informacja o ocenach była zawsze włączona
        if (this.oceny === undefined) $('#node-input-oceny').prop('checked', true);
        $('#node-input-oceny')
          .on('change', function () {
            $('.afya-librus-grades').toggle(this.checked);
          })
          .trigger('change');
        $('#node-input-uwagi')
          .on('change', function () {
            $('.afya-librus-notes').toggle(this.checked);
          })
          .trigger('change');

        // strona z ocenami: adres liczony z httpNodeRoot, np. http://node-red:1880/afya/jas
        const adresStrony = function () {
          const root = String((RED.settings && RED.settings.httpNodeRoot) || '/').replace(/\/+$/, '');
          const sciezka = String($('#node-input-sciezka').val() || '').trim().replace(/^\/+|\/+$/g, '');
          return location.origin + root + '/' + sciezka;
        };
        const linkZTokenem = function () {
          const token = String($('#node-input-tokenStrony').val() || '').trim();
          return token ? adresStrony() + '?token=' + encodeURIComponent(token) : '';
        };
        const odswiezStrone = function () {
          const wl = $('#node-input-strona').is(':checked');
          $('.afya-librus-page').toggle(wl);
          $('#afya-librus-url').text(adresStrony()).attr('href', adresStrony());
          const link = linkZTokenem();
          $('#afya-librus-token-link').text(link).attr('href', link);
          $('.afya-librus-token-row').toggle(wl && !!link);
        };
        $('#node-input-strona').on('change', odswiezStrone);
        $('#node-input-sciezka, #node-input-tokenStrony').on('change keyup', odswiezStrone);
        $('#afya-librus-token-gen').on('click', function (e) {
          e.preventDefault();
          const bajty = new Uint8Array(24);
          crypto.getRandomValues(bajty);
          const token = btoa(String.fromCharCode.apply(null, bajty)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          $('#node-input-tokenStrony').val(token).trigger('change');
        });
        $('#afya-librus-token-copy').on('click', function (e) {
          e.preventDefault();
          const link = linkZTokenem();
          if (link && RED.clipboard && RED.clipboard.copyText) RED.clipboard.copyText(link, $(this), T('linkCopied'));
          else if (link && navigator.clipboard) navigator.clipboard.writeText(link);
        });
        odswiezStrone();

        const summary = function () {
          let text = '';
          if ($('#node-input-oceny').is(':checked')) {
            let grade = $('#node-input-szablon').val() || DEFAULT_GRADE;
            if ($('#node-input-zTablica').is(':checked')) grade += ' | oceny: %tablica%';
            text += T('sGrade') + '<br><code>' + esc(grade) + '</code>';
          } else {
            text += T('sNoGrade');
          }
          if ($('#node-input-uwagi').is(':checked')) {
            text += '<br>' + T('sNote') + '<br><code>' + esc($('#node-input-szablonUwagi').val() || DEFAULT_NOTE) + '</code>';
          } else {
            text += '<br>' + T('sNoNote');
          }
          text += '<br>' + T('sBoth');
          if ($('#node-input-bezPl').is(':checked')) text += '<br>' + T('sBezPl');
          if ($('#node-input-strona').is(':checked')) {
            const zHaslem = !!$('#node-input-hasloStrony').val();
            const zTokenem = !!String($('#node-input-tokenStrony').val() || '').trim();
            text += '<br>' + T('sPage') + ' <code>' + esc(adresStrony()) + '</code> – ' +
              (zHaslem && zTokenem ? T('sPwToken') : zHaslem ? T('sPw') : zTokenem ? T('sToken') : T('sOff')) + '.';
          }
          const key = plainKey(variable.typedInput('value'));
          text += '<br>' + (key
            ? T('sVar', { v: '<code>' + variable.typedInput('type') + '.' + esc(key) + '</code>' })
            : T('sNoVar'));
          $('#afya-librus-summary').html(text);
        };
        $('#node-input-szablon, #node-input-szablonUwagi').on('change keyup', summary);
        $('#node-input-oceny, #node-input-zTablica, #node-input-uwagi, #node-input-bezPl, #node-input-strona').on('change', summary);
        $('#node-input-sciezka, #node-input-tokenStrony, #node-input-hasloStrony').on('change keyup', summary);
        variable.on('change', summary);
        $('#node-input-lang').on('change', function () {
          T = afyaApplyLang(form, TEXTS, $(this).val());
          odswiezStrone();
          summary();
        });
        summary();
      },
    });
  })();
</script>

<script type="text/html" data-template-name="afya-librus">
  <div class="afya-form">
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> <span data-t="name">Name</span></label>
      <input type="text" id="node-input-name" data-t-ph="namePh" placeholder="e.g. Librus – John" style="width: 65%;">
    </div>
    <div class="form-row">
      <label for="node-input-lang"><i class="fa fa-language"></i> <span data-t="lang">Labels</span></label>
      <select id="node-input-lang" style="width: 65%;">
        <option value="auto">system language</option>
        <option value="en">English</option>
        <option value="pl">Polski</option>
      </select>
    </div>

    <div class="afya-section"><i class="fa fa-user-circle"></i> <span data-t="secAccount">Librus Synergia account</span></div>
    <div class="form-row">
      <label for="node-input-login"><i class="fa fa-user"></i> <span data-t="login">Login</span></label>
      <input type="text" id="node-input-login" data-t-ph="loginPh" placeholder="parent or student login" autocomplete="off" style="width: 65%;">
    </div>
    <div class="form-row">
      <label for="node-input-haslo"><i class="fa fa-lock"></i> <span data-t="password">Password</span></label>
      <input type="password" id="node-input-haslo" autocomplete="new-password" style="width: 65%;">
    </div>
    <div class="afya-hint" data-t="credHint">Stored as Node-RED credentials – never exported with the flow.</div>

    <div class="afya-section"><i class="fa fa-star-half-o"></i> <span data-t="secGrade">New grade</span></div>
    <div class="afya-check">
      <input type="checkbox" id="node-input-oceny">
      <label for="node-input-oceny" data-t="sendGrade">Send info about a new grade</label>
    </div>
    <div class="form-row afya-librus-grades">
      <label for="node-input-szablon"><i class="fa fa-commenting"></i> <span data-t="text">Text</span></label>
      <input type="text" id="node-input-szablon" placeholder="%uczen%: %zapis% z %przedmiot% (%kategoria%) %komentarz%" style="width: 65%;">
    </div>
    <div class="afya-check afya-librus-grades">
      <input type="checkbox" id="node-input-zTablica">
      <label for="node-input-zTablica" data-t="appendAll">Append all grades of the subject, e.g. <code>| oceny: 5(1), 6(3), 4[1](2)</code></label>
    </div>
    <div class="afya-hint afya-librus-grades">
      <code>%zapis%</code> <code>%ocena%</code> <code>%przedmiot%</code> <code>%kategoria%</code>
      <code>%komentarz%</code> <code>%waga%</code> <code>%data%</code> <code>%nauczyciel%</code> <code>%srednia%</code>
      <code>%tablica%</code> <code>%semestr%</code> <code>%uczen%</code> · <span data-t="output">output</span>: <code>payload.tekstOceny</code>
    </div>

    <div class="afya-section"><i class="fa fa-exclamation-circle"></i> <span data-t="secNote">New note</span></div>
    <div class="afya-check">
      <input type="checkbox" id="node-input-uwagi">
      <label for="node-input-uwagi" data-t="sendNote">Send info about a new note (<i>uwaga</i>)</label>
    </div>
    <div class="form-row afya-librus-notes">
      <label for="node-input-szablonUwagi"><i class="fa fa-commenting"></i> <span data-t="text">Text</span></label>
      <input type="text" id="node-input-szablonUwagi" placeholder="%uczen%: uwaga %rodzaj% – %tresc% (%nauczyciel%)" style="width: 65%;">
    </div>
    <div class="afya-hint afya-librus-notes">
      <code>%tresc%</code> <code>%rodzaj%</code> <code>%kategoria%</code> <code>%nauczyciel%</code>
      <code>%data%</code> <code>%uczen%</code> · <span data-t="output">output</span>: <code>payload.tekstUwagi</code>
    </div>

    <div class="afya-section"><i class="fa fa-mobile"></i> SMS</div>
    <div class="afya-check">
      <input type="checkbox" id="node-input-bezPl">
      <label for="node-input-bezPl" data-t="bezPl">Without Polish letters (160 instead of 70 characters per SMS)</label>
    </div>
    <div class="afya-hint" data-t="bothHint">Both texts together, one line each: <code>payload.tekst</code> – empty when nothing is new.</div>

    <div class="afya-section"><i class="fa fa-table"></i> <span data-t="secPage">Grades page</span></div>
    <div class="afya-check">
      <input type="checkbox" id="node-input-strona">
      <label for="node-input-strona" data-t="showPage">Show a web page with the grades (class, subjects A–Z, averages)</label>
    </div>
    <div class="form-row afya-librus-page">
      <label for="node-input-tytulStrony"><i class="fa fa-header"></i> <span data-t="pageTitle">Page title</span></label>
      <input type="text" id="node-input-tytulStrony" data-t-ph="pageTitlePh" placeholder="e.g. John's grades (empty = student's name)" style="width: 65%;">
    </div>
    <div class="form-row afya-librus-page">
      <label for="node-input-sciezka"><i class="fa fa-link"></i> <span data-t="pagePath">Page path</span></label>
      <input type="text" id="node-input-sciezka" placeholder="afya/john" style="width: 65%;">
    </div>
    <div class="afya-hint afya-librus-page"><span data-t="pathHint">One path per child, e.g. <code>afya/john</code> and <code>afya/anna</code>. Address:</span>
      <a id="afya-librus-url" target="_blank" rel="noopener"></a> <span data-t="afterDeploy">(works after deploy)</span></div>
    <div class="form-row afya-librus-page">
      <label for="node-input-hasloStrony"><i class="fa fa-key"></i> <span data-t="pagePassword">Page password</span></label>
      <input type="password" id="node-input-hasloStrony" autocomplete="new-password" style="width: 65%;">
    </div>
    <div class="afya-hint afya-librus-page" data-t="pwHint">Login form, then the browser stays logged in for 30 days. Stored as Node-RED credentials.</div>
    <div class="form-row afya-librus-page">
      <label for="node-input-tokenStrony"><i class="fa fa-ticket"></i> <span data-t="token">Access token</span></label>
      <input type="text" id="node-input-tokenStrony" data-t-ph="tokenPh" placeholder="optional – link without logging in" autocomplete="off" style="width: calc(65% - 92px);">
      <button type="button" id="afya-librus-token-gen" class="red-ui-button" style="margin-left: 4px;"><i class="fa fa-random"></i> <span data-t="generate">Generate</span></button>
    </div>
    <div class="afya-hint afya-librus-page" data-t="tokenHint">For a smart mirror or a wall tablet: the link below opens the page without logging in.
      Anyone with the link sees the grades – generate a new token to revoke it. Set a password, a token, or both.</div>
    <div class="afya-hint afya-librus-token-row"><a id="afya-librus-token-link" target="_blank" rel="noopener" style="word-break: break-all;"></a>
      <button type="button" id="afya-librus-token-copy" class="red-ui-button red-ui-button-small" style="margin-left: 6px;"><i class="fa fa-copy"></i> <span data-t="copy">Copy</span></button></div>

    <div class="afya-section"><i class="fa fa-database"></i> <span data-t="secVar">Context variable</span></div>
    <div class="form-row">
      <label for="node-input-variableName"><i class="fa fa-globe"></i> <span data-t="variable">Variable</span></label>
      <input type="text" id="node-input-variableName" data-t-ph="variablePh" placeholder="optional, e.g. librus_john" style="width: 65%;">
      <input type="hidden" id="node-input-scope">
    </div>
    <div class="afya-hint" data-t="varHint">Optional. Keeps the last <code>msg.payload</code> – choose <b>global</b> to read it from any flow.</div>

    <div class="afya-summary"><i class="fa fa-info-circle"></i><span id="afya-librus-summary"></span></div>
  </div>
</script>

<script type="text/html" data-help-name="afya-librus">
  <p>Logs in to the Polish school register <b>Librus Synergia</b>, reads the grades (optionally also teacher
    notes) and tells you <b>what is new and what it is for</b> – category, comment, weight, teacher.
    The output is ready for an SMS gateway. No Home Assistant needed.</p>

  <h3>Inputs</h3>
  <p>Every message starts one check – connect an <i>inject</i> repeated every hour.</p>
  <dl class="message-properties">
    <dt class="optional">test <span class="property-type">boolean</span></dt>
    <dd><code>true</code> – when nothing is new, the latest grade (and note) is reported as new, to test the SMS path
      (only the kinds that are switched on).</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload.ok <span class="property-type">boolean</span></dt>
    <dd><code>true</code> – read successfully, <code>false</code> – error (description in <code>payload.blad</code>).</dd>
    <dt>payload.nowe <span class="property-type">array</span></dt>
    <dd>Grades that were not there at the previous check (with the subject average in <code>srednia</code>) –
      also when <i>Send info about a new grade</i> is off.</dd>
    <dt>payload.tekstOceny <span class="property-type">string</span></dt>
    <dd>Ready SMS text about new grades (template <i>New grade</i>), one line per grade; empty when nothing is new
      or <i>Send info about a new grade</i> is off.</dd>
    <dt>payload.tekstUwagi <span class="property-type">string</span></dt>
    <dd>Ready SMS text about new notes (template <i>New note</i>), one line per note; empty when nothing is new
      or <i>Send info about a new note</i> is off.</dd>
    <dt>payload.tekst <span class="property-type">string</span></dt>
    <dd>Both texts together (grades first, then notes); empty when nothing is new.</dd>
    <dt>payload.oceny <span class="property-type">array</span></dt>
    <dd>All grades: <code>przedmiot, ocena, zapis, wartosc, kategoria, komentarz, data, nauczyciel, waga, liczy,
      semestr, typ, link, id</code>. <code>typ</code>: <code>biezaca</code> (regular) or <code>koncowa</code>
      (predicted / semester / final). <code>zapis</code> – as in the register: <code>5(3)</code>,
      <code>4[1](2)</code> = 4 after improving 1, weight 2.</dd>
    <dt>payload.tablica <span class="property-type">object</span></dt>
    <dd>All regular grades of a subject in one string: <code>{ "Matematyka": { "1": "5(3), 3-(2), 4[1](2)" } }</code>.</dd>
    <dt>payload.srednie <span class="property-type">object</span></dt>
    <dd>Weighted averages per term (<code>1</code>, <code>2</code>) and year (<code>R</code>):
      <code>{ "Matematyka": { "1": 4.25, "2": 4.5, "R": 4.4 } }</code> – as shown by Librus, or calculated from the
      Librus weights where the school hides them.</dd>
    <dt>payload.srednieLibrus <span class="property-type">object</span></dt>
    <dd>Only the averages Librus itself shows (columns Śr.I / Śr.II / Śr.R).</dd>
    <dt class="optional">payload.uwagi, payload.noweUwagi <span class="property-type">array</span></dt>
    <dd>Only with <i>Send info about a new note</i>: <code>tresc, data, nauczyciel, rodzaj, kategoria, id</code>.</dd>
    <dt>payload.uczen, payload.klasa <span class="property-type">string</span></dt>
    <dd>Student and class.</dd>
    <dt>payload.pierwszyOdczyt <span class="property-type">boolean</span></dt>
    <dd><code>true</code> on the very first check – grades are only remembered, <code>nowe</code> is empty.</dd>
  </dl>

  <h3>Grades page</h3>
  <p>With <i>Show a web page with the grades</i> the node serves a page at
    <code>http://&lt;node-red&gt;:1880/&lt;page path&gt;</code> (under <code>httpNodeRoot</code>): student and class,
    subjects in alphabetical order, the weighted average right after the subject name and the grades in order –
    hover or tap a grade to see its date, category, weight and teacher. Tabs: term 1, term 2, whole year.
    The average is taken from Librus (columns Śr.I / Śr.II / Śr.R); when the school hides it, it is calculated
    from the Librus weights and marked with <code>*</code>.</p>
  <p>Access: the <i>page password</i> (login form, session cookie for 30 days) and/or the <i>access token</i> –
    the link <code>…/afya/john?token=…</code> opens the page without logging in (smart mirror, wall tablet).
    Without a password and a token the page stays off. <i>Page title</i> is shown in the header and the browser
    tab (empty = student's name). Each child gets its own node, path and password/token, e.g.
    <code>afya/john</code> and <code>afya/anna</code>. The last result is kept, so the page works right after
    a restart.</p>

  <h3>Details</h3>
  <p>Seen grades are saved in <code>~/.node-red/afya-librus/</code>, so a restart does not cause duplicate SMS.
    Pass only a non-empty text to the SMS gateway: <code>payload.tekstOceny</code> for grades and
    <code>payload.tekstUwagi</code> for notes – a <i>switch</i> (“is not empty”) for each, so they go as separate SMS
    (also to different people). <code>payload.tekst</code> holds both together.
    With a <i>variable</i> set, the last <code>msg.payload</code> is also kept in a <b>global</b> or <b>flow</b>
    context variable.</p>
  <p>Ready flows: <b>Menu → Import → Examples → node-red-contrib-afya-librus</b>.</p>

  <h3>Polski</h3>
  <p>Loguje się do Librusa Synergia, czyta oceny (opcjonalnie uwagi) i podaje, co nowego i za co. Gotowy tekst
    SMS: oceny w <code>payload.tekstOceny</code>, uwagi w <code>payload.tekstUwagi</code>, oba razem w
    <code>payload.tekst</code> (puste, gdy nic nowego). Checkboxy <i>Send info about a new grade</i> i
    <i>Send info about a new note</i> włączają każdy z tekstów. <code>msg.test = true</code> – test SMS.
    Pierwszy odczyt tylko zapamiętuje oceny. Opcjonalnie ostatni wynik trafia do zmiennej <b>global</b> lub
    <b>flow</b>.</p>
  <p><b>Strona z ocenami</b> – po włączeniu węzeł pokazuje stronę pod podaną ścieżką (np. <code>/afya/jas</code>):
    klasa, przedmioty alfabetycznie, średnia ważona z Librusa zaraz po nazwie i kolejne oceny (data po najechaniu).
    Dostęp po haśle strony albo bez logowania z linku z tokenem (<code>?token=…</code>, np. na lustrze lub tablecie).
    Własny tytuł strony w polu <i>Page title</i>. Każde dziecko – osobny węzeł, ścieżka i hasło/token.</p>

  <p><small>Marcin Chuć · MIT · unofficial, not affiliated with Librus</small></p>
</script>
